*{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;box-sizing:border-box;}
body{background:#eef1f5;margin:0;}
.ep-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);background:#fff;color:var(--t2);border-radius:4px;padding:7px 14px;font-size:13px;cursor:pointer;transition:all .18s;line-height:1;white-space:nowrap;}
.ep-btn:hover{color:var(--p);border-color:#c6e2ff;background:#ecf5ff;}
.ep-btn.primary{background:var(--p);border-color:var(--p);color:#fff;}
.ep-btn.primary:hover{background:#66b1ff;border-color:#66b1ff;}
.ep-btn.ns{background:var(--ns);border-color:var(--ns);color:#fff;}
.ep-btn.ns:hover{background:#ff9847;border-color:#ff9847;}
.ep-btn.plain{color:var(--p);border-color:#c6e2ff;background:#ecf5ff;}
.ep-btn.sm{padding:4px 10px;font-size:12px;}
.ep-input{width:100%;border:1px solid var(--bd);border-radius:4px;padding:7px 11px;font-size:13px;color:var(--t1);outline:none;transition:border-color .18s;background:#fff;}
.ep-input:focus{border-color:var(--p);box-shadow:0 0 0 2px rgba(64,158,255,.12);}
.ep-input::placeholder{color:#a8abb2;}
.ep-input.ferr{border-color:#f56c6c !important;}
select.ep-input{appearance:auto;}
.kb{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border:1px solid #c9cdd4;border-bottom-width:2px;border-radius:4px;background:#f7f8fa;color:#4e5969;font-size:11px;font-weight:600;}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--bd);background:#fff;color:var(--t2);border-radius:4px;padding:5px 10px;font-size:12px;cursor:pointer;transition:all .15s;user-select:none;}
.chip:hover{border-color:#c6e2ff;color:var(--p);}
.chip.on{background:#ecf5ff;border-color:var(--p);color:var(--p);font-weight:600;}
.tag{display:inline-flex;align-items:center;border-radius:3px;padding:1px 7px;font-size:11px;line-height:18px;white-space:nowrap;}
.tag.ns{background:var(--nsbg);color:var(--ns);border:1px solid var(--nsbd);}
.tag.std{background:#ecf5ff;color:var(--p);border:1px solid #c6e2ff;}
.tag.ok{background:#f0f9eb;color:#67c23a;border:1px solid #c2e7b0;}
.tag.warn{background:#fdf6ec;color:#e6a23c;border:1px solid #f5dab1;}
.tag.gray{background:#f4f4f5;color:#909399;border:1px solid #d3d4d6;}
.menu-item{display:flex;align-items:center;gap:9px;padding:0 18px;height:44px;color:#bfd3ea;font-size:13.5px;cursor:pointer;transition:background .15s;user-select:none;}
.menu-item:hover{background:rgba(255,255,255,.06);}
.submenu-item{display:flex;align-items:center;gap:8px;padding:0 18px 0 44px;height:38px;color:#93a8c2;font-size:12.5px;cursor:pointer;transition:all .15s;position:relative;user-select:none;}
.submenu-item:hover{color:#fff;}
.submenu-item.active{color:#fff;background:var(--sba);}
.submenu-item.active::before{content:"";position:absolute;left:30px;width:5px;height:5px;border-radius:50%;background:var(--ns);}
.twrap{overflow:auto;border:1px solid var(--bdl);border-radius:6px;background:#fff;}
.ep-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:760px;}
.ep-table th{background:#f5f7fa;color:var(--t3);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--bdl);text-align:left;white-space:nowrap;}
.ep-table td{padding:9px 10px;border-bottom:1px solid #f0f2f5;color:var(--t2);vertical-align:middle;}
.ep-table tbody tr:hover td{background:#f8fafc;}
.ep-table .exp td{background:#fafbfc;padding:0;}
.link-btn{color:var(--p);cursor:pointer;font-size:12.5px;margin-right:12px;}
.link-btn:hover{text-decoration:underline;}
.link-btn.danger{color:#f56c6c;}
.dlg-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:9vh 16px 16px;opacity:0;transition:opacity .18s;overflow:auto;}
.dlg-overlay.show{opacity:1;}
.dlg{background:#fff;border-radius:8px;width:520px;max-width:100%;box-shadow:0 12px 40px rgba(0,0,0,.18);transform:translateY(-14px);transition:transform .18s;display:flex;flex-direction:column;max-height:82vh;}
.dlg-overlay.show .dlg{transform:none;}
.dlg-head{padding:14px 18px;font-size:14.5px;font-weight:600;color:var(--t1);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f0f2f5;flex:none;}
.dlg-head i{cursor:pointer;color:var(--t3);padding:4px;}
.dlg-body{padding:18px;overflow:auto;}
.dlg-foot{padding:12px 18px;border-top:1px solid #f0f2f5;display:flex;justify-content:flex-end;gap:8px;flex:none;}
.frow{display:flex;margin-bottom:14px;align-items:flex-start;}
.flab{width:88px;flex:none;text-align:right;padding-right:12px;font-size:13px;color:var(--t2);line-height:34px;}
.flab.req::before{content:"*";color:#f56c6c;margin-right:3px;}
.fval{flex:1;min-width:0;}
.hint{font-size:11px;color:#b1b3b8;margin-top:4px;}
.tabbar{display:flex;border-bottom:1px solid var(--bdl);margin-bottom:12px;gap:2px;}
.tab{padding:8px 16px;font-size:13px;color:var(--t2);cursor:pointer;border-bottom:2px solid transparent;user-select:none;}
.tab.on{color:var(--p);border-color:var(--p);font-weight:600;}
.card{background:#fff;border:1px solid var(--bdl);border-radius:6px;padding:14px;}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:10px 4px 2px;font-size:12px;color:var(--t3);}
.pg{min-width:26px;height:26px;padding:0 6px;border:1px solid var(--bd);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;background:#fff;cursor:pointer;}
.pg.on{color:var(--p);border-color:var(--p);background:#ecf5ff;}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-16px);background:#fff;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.14);padding:11px 18px;font-size:13.5px;display:flex;gap:9px;align-items:center;opacity:0;transition:all .28s;z-index:400;border:1px solid var(--bdl);max-width:86vw;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.switch{width:36px;height:19px;border-radius:10px;background:var(--p);position:relative;cursor:pointer;transition:background .2s;flex:none;display:inline-block;}
.switch::after{content:"";position:absolute;top:2px;left:19px;width:15px;height:15px;border-radius:50%;background:#fff;transition:left .2s;}
.switch.off{background:#c0c4cc;}.switch.off::after{left:2px;}
.tpl-card{border:1px dashed #ffc590;background:var(--nsbg);border-radius:8px;padding:10px 12px;cursor:pointer;transition:all .16s;}
.tpl-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(255,125,28,.18);border-color:var(--ns);}
.tpl-card.flash{animation:tplflash .9s ease;}
@keyframes tplflash{0%{box-shadow:0 0 0 0 rgba(255,125,28,.5);}100%{box-shadow:0 0 0 14px rgba(255,125,28,0);}}
.hotkey-flash{animation:hkf 1s ease;}
@keyframes hkf{0%,100%{box-shadow:none;}30%{box-shadow:0 0 0 4px rgba(255,125,28,.35);}}
.order-row{animation:rowin .3s ease;}
@keyframes rowin{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
.step-dot{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t2);}
.step-dot .d{width:20px;height:20px;border-radius:50%;background:#ecf5ff;color:var(--p);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none;}
.parse-chip{display:inline-flex;align-items:center;gap:4px;background:#f0f9eb;border:1px solid #c2e7b0;color:#4c7a2c;border-radius:3px;font-size:11px;padding:1px 7px;}
.stat-card{background:#fff;border:1px solid var(--bdl);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;}
.stat-card .v{font-size:22px;font-weight:700;color:var(--t1);}
.stat-card .l{font-size:12px;color:var(--t3);}
.bar{height:8px;border-radius:4px;background:#ecf5ff;overflow:hidden;min-width:90px;}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#409eff,#79bbff);border-radius:4px;}
::-webkit-scrollbar{width:8px;height:8px;}::-webkit-scrollbar-thumb{background:#c9cdd4;border-radius:4px;}
@media (max-width:900px){ #sidebar{width:100% !important;max-height:180px;overflow:auto;} }
</style>

function toast(msg,warn){$("toastTxt").textContent=msg;$("toastIc").className=warn?"fa-solid fa-circle-exclamation text-[16px] text-[#e6a23c]":"fa-solid fa-circle-check text-[16px] text-[#67c23a]";$("toast").classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").classList.remove("show"),2600);}
function dialog(o){
 const ov=document.createElement("div");ov.className="dlg-overlay";
 ov.innerHTML=`<div class="dlg" style="width:${o.width||"520px"}">
  <div class="dlg-head"><span>${o.title}</span><i class="fa-solid fa-xmark" data-close></i></div>
  <div class="dlg-body">${o.body}</div>
  ${o.footer===false?"":`<div class="dlg-foot">${o.footerExtra||""}<button class="ep-btn" data-close>${o.cancelText||"取 消"}</button><button class="ep-btn primary" data-ok>${o.okText||"确 定"}</button></div>`}
 </div>`;
 document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add("show"));
 const close=()=>{ov.classList.remove("show");setTimeout(()=>ov.remove(),180);};
 ov.addEventListener("click",e=>{
  if(e.target===ov||e.target.closest("[data-close]")){close();return;}
  if(e.target.closest("[data-ok]")){if(o.onOk&&o.onOk(ov)===false)return;close();}
 });
 return {el:ov,close};
}

function outDialog(id){

 dialog({title:`出库 · ${o.productionNo}`,width:"460px",body:
  `<div class="hint" style="margin:0 0 12px 0;">${o.customerName} · ${o.specification} · 待出库 <b style="color:#e6a23c">${remain}</b> 件</div>`+
  field("本次出库数",`<input class="ep-input" id="out-num" type="number" min="1" max="${remain}" value="${remain}" />`,1)+
  field("出库货位",`<select class="ep-input" id="out-wh">${opts(DB.warehouses,w=>w.warehouseName,w=>w.warehouseName)}</select>`),
  onOk:ov=>{
   const n=parseInt(ov.querySelector("#out-num").value||"0",10);
   if(n<=0||n>remain){toast(`出库数需在 1-${remain} 之间`,true);return false;}
   o.finishNum+=n;
   const inv=DB.inventory.find(x=>x.specification===o.specification);
   if(inv)inv.stockQuantity=Math.max(0,inv.stockQuantity-n);
   toast(o.finishNum>=o.num?`出库成功，${o.productionNo} 已全部出库完成`:`出库成功，本次 ${n} 件，剩余 ${o.num-o.finishNum} 件`);
   switchView("out");
  }});
}

 "d-del":t=>{const d=DB.depts.find(x=>x.deptId==t.dataset.id);
   if(d.deptId===1){toast("根部门不可删除",true);return;}
   confirmDlg(`是否确认删除部门「${d.deptName}」？`,()=>{DB.depts=DB.depts.filter(x=>x.deptId!=t.dataset.id);toast("删除成功");switchView("dept");});},
 "p-add":()=>postFormDialog(null),
 "p-edit":t=>postFormDialog(DB.posts.find(p=>p.postId==t.dataset.id)),
 "p-del":t=>{const p=DB.posts.find(x=>x.postId==t.dataset.id);confirmDlg(`是否确认删除岗位「${p.postName}」？`,()=>{DB.posts=DB.posts.filter(x=>x.postId!=t.dataset.id);toast("删除成功");switchView("post");});}
};
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-act]");if(t&&A[t.dataset.act])A[t.dataset.act](t);
 if(!e.target.closest("#nsCust")&&!e.target.closest("#nsCustList")){const d=$("nsCustList");if(d)d.classList.add("hidden");}
});
document.addEventListener("keydown",e=>{
 if(e.key==="F2"){e.preventDefault();switchView("nonstd");const p=$("quickPanel");if(p){p.classList.remove("hotkey-flash");void p.offsetWidth;p.classList.add("hotkey-flash");}}
 if(cur!=="nonstd")return;
 if(e.altKey&&/^[1-4]$/.test(e.key)){e.preventDefault();nsApplyTpl(+e.key-1);}
 if(e.ctrlKey&&e.key==="Enter"){e.preventDefault();nsCreate();}
 else if(e.key==="Enter"&&document.activeElement.tagName==="INPUT"&&document.activeElement.id!=="nsCust"){e.preventDefault();nsAddItem();}
});
/* ========================= 初始化 ========================= */
renderSidebar();
switchView("nonstd");
</script>
</body>
</html>
